[workspace]
members = [
    "crates/seglog",
    "crates/tephra",
    "crates/tephra-client",
    "crates/tephra-proto",
    "crates/tephra-server",
    "crates/tephra-types",
    "site/tephra-site-examples",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
seglog = { path = "crates/seglog" }
tephra = { path = "crates/tephra" }
tephra-client = { path = "crates/tephra-client" }
tephra-proto = { path = "crates/tephra-proto" }
tephra-server = { path = "crates/tephra-server" }
tephra-types = { path = "crates/tephra-types" }

# Third-party
argh = "0.1"
config = { version = "0.15", default-features = false }
crc32fast = "1.5"
ctrlc = "3"
dashmap = "6"
flume = { version = "0.12", default-features = false }
fst = { version = "0.4.7", default-features = false }
nix = "0.31"
protobuf = "=4.35.1-release"
protobuf-codegen = "=4.35.1-release"
serde = "1"
smallvec = "1"
socket2 = "0.6.5"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# Only pulled in by the `umadb-compare` bench feature (the tephra-vs-umadb comparison).
# Pinned to the exact rev the comparison was run against, so the numbers reproduce.
umadb-core = { git = "https://github.com/umadb-io/umadb", rev = "cb4e9161c5617ded16aaf3db0c2f61bbfbf39701" }
umadb-dcb = { git = "https://github.com/umadb-io/umadb", rev = "cb4e9161c5617ded16aaf3db0c2f61bbfbf39701" }

# Dev
criterion = "0.8"
tempfile = "3"
