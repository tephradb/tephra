[workspace]
members = [".", "crates/seglog"]
resolver = "2"

[package]
name = "dcbdb"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5"
fst = { version = "0.4.7", default-features = false }
seglog = { path = "crates/seglog" }
smallvec = "1"
thiserror = "2.0"
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
tracing = ["dep:tracing", "seglog/tracing"]
zstd = ["seglog/zstd"]
