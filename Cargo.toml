[workspace]
members = [".", "crates/seglog"]
resolver = "2"

[package]
name = "dcbdb"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5"
flume = { version = "0.12", default-features = false }
fst = { version = "0.4.7", default-features = false }
seglog = { path = "crates/seglog" }
smallvec = "1"
thiserror = "2.0"
tracing = { version = "0.1", optional = true }

# Only pulled in by the `umadb-compare` bench feature (the dcbdb-vs-umadb comparison).
# Pinned to the exact rev the comparison was run against, so the numbers reproduce.
umadb-core = { git = "https://github.com/umadb-io/umadb", rev = "cb4e9161c5617ded16aaf3db0c2f61bbfbf39701", optional = true }
umadb-dcb = { git = "https://github.com/umadb-io/umadb", rev = "cb4e9161c5617ded16aaf3db0c2f61bbfbf39701", optional = true }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[features]
async = ["flume/async"]
tracing = ["dep:tracing", "seglog/tracing"]
zstd = ["seglog/zstd"]
# Enables the dcbdb-vs-umadb comparison bench (`--bench compare`).
umadb-compare = ["dep:umadb-core", "dep:umadb-dcb"]

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "compare"
harness = false
