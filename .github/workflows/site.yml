name: site

# Build and test the documentation examples and the static site on every push to main and every
# pull request, but publish to GitHub Pages only on a release: the `v*.*.*` tag release-plz pushes
# when a release PR is merged (the same tag that fires the docker build). A manual run
# (workflow_dispatch) also deploys, as an on-demand redeploy.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Compile and run every code sample. A signature change breaks this job, not the docs silently.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-protoc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Confirm the crate-root re-exports build
        run: cargo build -p tephra
      - name: Compile and run the site examples
        run: cargo test -p tephra-site-examples

  # Build the static site. Depends on the examples passing, since the pages import their source.
  build:
    runs-on: ubuntu-latest
    needs: examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  # Publish only on a release tag (v*.*.*, pushed by release-plz when a release PR merges) or a
  # manual run. Regular pushes to main and pull requests build and test the site above but never
  # deploy.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
