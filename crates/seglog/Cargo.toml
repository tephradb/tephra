[package]
name = "seglog"
authors = ["Ari Seyhun <dev@tqwewe.com>"]
categories = ["database-implementations", "development-tools"]
description = "High-performance segment log with CRC-32 validation - optimized for event sourcing and append-only storage"
edition = "2024"
keywords = ["database", "event-sourcing", "event-store", "storage"]
license = "Apache-2.0"
version = "0.3.1"
rust-version = "1.95.0"
repository.workspace = true

[dependencies]
crash-points.workspace = true
crc32fast.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[features]
tracing = ["dep:tracing"]
# Turns on the gated crash and fault injection points. Off by default: zero cost.
crash-points = ["crash-points/enabled"]

[[bench]]
name = "seglog_bench"
harness = false
