[package]
name = "tephra-server"
description = "Synchronous, thread-per-connection TCP server exposing a tephra event store over the length-prefixed protobuf protocol"
edition = "2024"
license = "Apache-2.0"
version = "0.3.1"
rust-version = "1.95.0"
repository.workspace = true

[dependencies]
tephra.workspace = true
tephra-proto.workspace = true

argh.workspace = true
config = { workspace = true, features = ["toml"] }
ctrlc.workspace = true
flume.workspace = true
protobuf.workspace = true
serde = { workspace = true, features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
socket2.workspace = true

[dev-dependencies]
tephra-client = { workspace = true, features = ["async"] }

tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream.workspace = true

[features]
# Turns on the gated crash and fault injection points in the engine. Off by default.
crash-points = ["tephra/crash-points"]

[[bin]]
name = "tephra-server"
path = "src/main.rs"

[lib]
name = "tephra_server"
path = "src/lib.rs"
