[package]
name = "tephra"
description = "A DCB-compliant, immutable event store with global ordering."
version = "0.2.1"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository.workspace = true

[dependencies]
seglog.workspace = true
tephra-types.workspace = true

crc32fast.workspace = true
dashmap.workspace = true
flume.workspace = true
fst.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[features]
async = ["flume/async"]
tracing = ["dep:tracing", "seglog/tracing"]

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "condition_path"
harness = false
