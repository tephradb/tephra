[package]
name = "tephra"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"

[dependencies]
seglog.workspace = true
tephra-types.workspace = true

crc32fast.workspace = true
dashmap.workspace = true
flume.workspace = true
fst.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[features]
async = ["flume/async"]
tracing = ["dep:tracing", "seglog/tracing"]

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "condition_path"
harness = false
