[package]
name = "tephra"
description = "A DCB-compliant, immutable event store with global ordering."
version = "0.3.6"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository.workspace = true

[dependencies]
seglog.workspace = true
tephra-types.workspace = true

crc32fast.workspace = true
dashmap.workspace = true
event-listener = { workspace = true, optional = true }
flume.workspace = true
fst.workspace = true
futures-core = { workspace = true, optional = true }
smallvec.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[features]
async = ["flume/async", "dep:futures-core", "dep:event-listener"]
tracing = ["dep:tracing", "seglog/tracing"]
# Turns on the gated crash and fault injection points across the engine and seglog. The macros
# and their instrumentation live in seglog's `crash_points` module; tephra drives them through
# seglog.
crash-points = ["seglog/crash-points"]

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "condition_path"
harness = false
