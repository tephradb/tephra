[package]
name = "tephra"
description = "A DCB-compliant, immutable event store with global ordering."
version = "0.3.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository.workspace = true

[dependencies]
seglog.workspace = true
tephra-types.workspace = true

crash-points.workspace = true
crc32fast.workspace = true
dashmap.workspace = true
flume.workspace = true
fst.workspace = true
futures-core = { workspace = true, optional = true }
smallvec.workspace = true
thiserror.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[features]
async = ["flume/async", "dep:futures-core"]
tracing = ["dep:tracing", "seglog/tracing"]
# Turns on the gated crash and fault injection points across the engine and seglog.
crash-points = ["crash-points/enabled", "seglog/crash-points"]

[[bench]]
name = "write_path"
harness = false

[[bench]]
name = "read_path"
harness = false

[[bench]]
name = "condition_path"
harness = false
