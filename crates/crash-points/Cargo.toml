[package]
name = "crash-points"
description = "Gated crash and fault injection points for Tephra's crash-consistency test suite."
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
repository.workspace = true
publish = false

[dependencies]

[features]
# Off by default: every macro expands to nothing and no code is generated, so a normal
# build pays zero runtime cost. The crash harness turns this on through a passthrough
# feature on the consuming crates.
enabled = []
