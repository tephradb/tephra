[package]
name = "tephra-client"
description = "TCP client for a tephra event store speaking the length-prefixed protobuf protocol: a blocking client, plus an optional multiplexing async (tokio) client behind the `async` feature"
edition = "2024"
license = "Apache-2.0"
version = "0.3.2"
rust-version = "1.85.0"
repository.workspace = true

[dependencies]
tephra-proto.workspace = true
tephra-types.workspace = true

futures-core = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "rt", "sync", "io-util"] }
tokio-stream = { workspace = true, optional = true }

[features]
# A multiplexing async client (`AsyncClient`) built on tokio, alongside the blocking one.
async = ["dep:tokio", "dep:tokio-stream", "dep:futures-core", "tephra-proto/tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "roundtrip_async"
required-features = ["async"]
