[package]
name = "tephra-proto"
description = "Wire protocol (protobuf messages + length-prefixed framing) shared by the tephra TCP server and client"
edition = "2024"
license = "Apache-2.0"
version = "0.1.1"
rust-version = "1.85.0"
repository.workspace = true

[dependencies]
tephra-types.workspace = true

protobuf.workspace = true
tokio = { workspace = true, optional = true, features = ["io-util"] }

[build-dependencies]
protobuf-codegen.workspace = true

[features]
# Async (tokio) framing helpers alongside the synchronous ones.
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
